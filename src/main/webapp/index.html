cat > src/main/webapp/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Bill Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #f1f5f9;
            padding: 24px 20px;
            color: #0f172a;
        }
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
            gap: 16px;
        }
        .title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b, #2d3a4b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 18px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            border: 1px solid #e9eef3;
        }
        .card .value {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
        }
        .two-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
        }
        .form-section {
            flex: 1.2;
            min-width: 280px;
        }
        .table-section {
            flex: 2.2;
            min-width: 340px;
        }
        .form-card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #e9eef3;
            position: sticky;
            top: 20px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: #334155;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }
        .btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: #2563eb;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            margin-top: 12px;
        }
        .table-wrapper {
            background: white;
            border-radius: 28px;
            padding: 4px 0px;
            border: 1px solid #eef2f8;
            overflow-x: auto;
        }
        .bill-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .bill-table th {
            text-align: left;
            padding: 18px 16px;
            background: #fafcff;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }
        .bill-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #ecf3f9;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-paid {
            background: #dff9e6;
            color: #15803d;
        }
        .status-pending {
            background: #ffedd5;
            color: #b45309;
        }
        .status-overdue {
            background: #fee2e2;
            color: #b91c1c;
        }
        .action-icons i {
            margin: 0 5px;
            cursor: pointer;
            font-size: 1.1rem;
            color: #6c7a91;
        }
        .action-icons i:hover {
            color: #2563eb;
        }
        .delete-icon:hover {
            color: #dc2626 !important;
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 16px;
            gap: 12px;
        }
        .search-box {
            background: white;
            border-radius: 60px;
            padding: 6px 16px;
            border: 1px solid #e2e8f0;
        }
        .search-box input {
            border: none;
            padding: 8px 10px;
            background: transparent;
            outline: none;
            width: 200px;
        }
        @media (max-width: 780px) {
            body { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="title">
            <h1><i class="fas fa-store"></i> Distributor Bill Manager</h1>
            <p>Track purchase bills, due dates & payments — real-time view</p>
        </div>
    </div>

    <div class="summary-cards">
        <div class="card"><h3>Total Bills</h3><div class="value" id="totalBills">0</div></div>
        <div class="card"><h3>Outstanding</h3><div class="value" id="totalDue">₹0</div></div>
        <div class="card"><h3>Overdue Bills</h3><div class="value" id="overdueCount">0</div></div>
        <div class="card"><h3>Due within 7 days</h3><div class="value" id="dueSoonCount">0</div></div>
    </div>

    <div class="two-columns">
        <div class="form-section">
            <div class="form-card">
                <h2><i class="fas fa-receipt"></i> Add New Bill</h2>
                <div class="input-group">
                    <label>Distributor Name</label>
                    <input type="text" id="distName" placeholder="e.g., Global Distributors">
                </div>
                <div class="input-group">
                    <label>Bill Amount (₹)</label>
                    <input type="number" id="billAmount" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>Purchase Date</label>
                    <input type="date" id="purchaseDate">
                </div>
                <div class="input-group">
                    <label>Payment Terms</label>
                    <select id="paymentTerms">
                        <option value="30">Net 30 (standard)</option>
                        <option value="15">Net 15</option>
                        <option value="45">Net 45</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="addBillBtn"><i class="fas fa-plus-circle"></i> Add Bill</button>
                <button class="btn btn-outline" id="demoDataBtn"><i class="fas fa-chart-simple"></i> Load Sample Bills</button>
            </div>
        </div>

        <div class="table-section">
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search distributor...">
                </div>
                <select id="filterStatus">
                    <option value="all">All bills</option>
                    <option value="pending">Pending only</option>
                    <option value="overdue">Overdue only</option>
                    <option value="paid">Paid only</option>
                </select>
            </div>
            <div class="table-wrapper">
                <table class="bill-table">
                    <thead>
                        <tr><th>Distributor</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
EOF
